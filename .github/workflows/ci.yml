name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle exécution annule celle en cours sur la même branche ou PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation de Node
        uses: actions/setup-node@v5
        with:
          # Même version que le Dockerfile (Vite 8 requiert Node 20.19+ ou 22.12+).
          node-version: 24
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b` puis `vite build`
      - name: Build
        run: npm run build
