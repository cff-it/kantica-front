# Gabarit nginx du déploiement Railway : même contenu que nginx.conf, à garder aligné, sauf le proxy de l'API.
# Les ${VARIABLES} d'environnement (API_UPSTREAM, NGINX_LOCAL_RESOLVERS) sont remplacées au démarrage du conteneur
# par envsubst. Voir Dockerfile.railway.
server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Import Excel des membres : fichiers plus gros que la limite par défaut (1m).
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Attention : nginx n'hérite pas des add_header du niveau server dès qu'un
  # location en déclare un. Les en-têtes de sécurité sont donc répétés dans
  # chaque location qui définit son propre Cache-Control.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Sur Railway, l'adresse privée du back change à chaque déploiement : un proxy_pass écrit en dur ne serait résolu
  # qu'au démarrage de nginx et renverrait des 502 après un redéploiement du back. Passer par une variable oblige
  # nginx à résoudre le nom à l'exécution, avec le DNS du conteneur.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  # API Laravel : servie sur la même origine que le front, sans CORS (Sanctum en mode jeton Bearer).
  location ~ ^/(api|sanctum)/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $http_host;
    # Le TLS est terminé par le proxy de Railway : on retransmet ses en-têtes plutôt que ceux vus par nginx.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Génération PPTX et imports : peuvent dépasser les 60 s par défaut.
    proxy_read_timeout 120s;
  }

  # Fichiers générés par Vite : le nom contient un hash, cache longue durée.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # index.html ne doit jamais être mis en cache, sinon un déploiement
  # ne serait pas pris en compte (il référence les nouveaux assets hashés).
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Fallback SPA : toute route inconnue est gérée côté client.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
