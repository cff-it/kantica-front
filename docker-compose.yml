services:
  # Production : build statique servi par nginx (http://localhost:8080)
  #   docker compose up --build
  # nginx proxifie /api et /sanctum vers le back (API_UPSTREAM).
  app:
    build:
      context: .
      target: prod
    image: kantica-front:latest
    ports:
      - "8080:8080"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8008}
    extra_hosts:
      # Permet de joindre le back lancé sur l'hôte (Linux).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Développement : Vite avec HMR (http://localhost:5173 par défaut)
  #   docker compose --profile dev up dev
  # Port hôte déjà pris ? DEV_PORT=5174 docker compose --profile dev up dev
  # Le proxy Vite redirige /api et /sanctum vers le back (API_PROXY_TARGET).
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8008}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      # Volume anonyme : garde les node_modules de l'image, pas ceux de l'hôte.
      - /app/node_modules
