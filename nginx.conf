# Gabarit nginx : les ${VARIABLES} d'environnement (API_UPSTREAM) sont
# remplacées au démarrage du conteneur par envsubst. Les variables nginx
# ($uri, $host...) ne sont pas touchées. Voir le Dockerfile, étape "prod".
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Import Excel des membres : fichiers plus gros que la limite par défaut (1m).
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Attention : nginx n'hérite pas des add_header du niveau server dès qu'un
  # location en déclare un. Les en-têtes de sécurité sont donc répétés dans
  # chaque location qui définit son propre Cache-Control.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API Laravel et cookie CSRF de Sanctum : servis sur la même origine que le
  # front (Sanctum en mode SPA, cookies de session sans CORS).
  location ~ ^/(api|sanctum)/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Génération PPTX et imports : peuvent dépasser les 60 s par défaut.
    proxy_read_timeout 120s;
  }

  # Fichiers générés par Vite : le nom contient un hash, cache longue durée.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # index.html ne doit jamais être mis en cache, sinon un déploiement
  # ne serait pas pris en compte (il référence les nouveaux assets hashés).
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Fallback SPA : toute route inconnue est gérée côté client.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
